name: Build Ubuntu

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_ubuntu_modern:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-22.04', 'ubuntu-20.04']

    steps:
    - uses: actions/checkout@v4

    - name: Install i386 deps
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install gcc-multilib g++-multilib libc6-dev-i386 -y

    - name: Install nightly rust
      run: |
        rustup toolchain install nightly-2022-11-06-i686-unknown-linux-gnu --force-non-host
        rustup default nightly-2022-11-06-i686-unknown-linux-gnu

    - name: Build server plugin
      run: |
        cargo build --package server --release
        strip -s target/release/libserver.so -o stripped.so

    - uses: actions/upload-artifact@v4
      with:
        name: cef-${{ matrix.os }}.so
        path: stripped.so

  build_ubuntu_18:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build in Ubuntu 18.04 container
      run: |
        docker run --rm -v $PWD:/workspace -w /workspace ubuntu:18.04 bash -c '
          apt-get update
          apt-get install build-essential curl git -y
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2022-11-06-i686-unknown-linux-gnu
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --package server --release
          strip -s target/release/libserver.so -o stripped-ubuntu18.so
        '

    - uses: actions/upload-artifact@v4
      with:
        name: cef-ubuntu-18.04.so
        path: stripped-ubuntu18.so
