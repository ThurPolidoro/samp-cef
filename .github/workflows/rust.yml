name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_server_ubuntu_modern:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-20.04]

    steps:
    - uses: actions/checkout@v4

    - name: Install i686 libs
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386
    
    - name: Install nightly rust i686
      run: |
        rustup toolchain install nightly-2022-11-06-i686-unknown-linux-gnu
        rustup default nightly-2022-11-06-i686-unknown-linux-gnu

    - name: Build server plugin
      run: |
        cargo build --package server --release
        strip -s target/release/libserver.so -o stripped.so

    - uses: actions/upload-artifact@v4
      with:
        name: cef-${{ matrix.os }}.so
        path: stripped.so

  build_server_ubuntu_18:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build in Ubuntu 18.04 container
      run: |
        docker run --rm -v $PWD:/workspace -w /workspace ubuntu:18.04 bash -c '
          apt-get update
          apt-get install build-essential curl git libc6-dev gcc g++ -y
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2022-11-06-i686-unknown-linux-gnu
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --package server --release
          strip -s target/release/libserver.so -o stripped-ubuntu18.so
        '

    - uses: actions/upload-artifact@v4
      with:
        name: cef-ubuntu-18.04.so
        path: stripped-ubuntu18.so

  build_server_centos:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build in CentOS 7.5 container
      run: |
        docker run --rm -v $PWD:/workspace -w /workspace centos:7.5.1804 bash -c '
          sed -i "s/mirror.centos.org/vault.centos.org/g" /etc/yum.repos.d/*.repo
          sed -i "s/^#.*baseurl=http/baseurl=http/g" /etc/yum.repos.d/*.repo
          sed -i "s/^mirrorlist=http/#mirrorlist=http/g" /etc/yum.repos.d/*.repo
          sed -i "s|\$releasever|7.5.1804|g" /etc/yum.repos.d/*.repo
          yum install git curl gcc gcc-c++ make glibc-devel libgcc zlib -y
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2022-11-06-i686-unknown-linux-gnu
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --package server --release
          strip -s target/release/libserver.so -o stripped-centos7.so
        '

    - uses: actions/upload-artifact@v4
      with:
        name: cef-centos-7.so
        path: stripped-centos7.so

  build_server_alma:
    runs-on: ubuntu-latest
    container: almalinux:${{ matrix.version }}
    strategy:
      matrix:
        version: [8, 9]

    steps:
    - name: Install i686 deps
      run: |
        dnf install -y epel-release
        dnf install -y --allowerasing git curl gcc gcc-c++ make glibc-devel libgcc zlib

    - uses: actions/checkout@v4

    - name: Install nightly rust i686
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2022-11-06-i686-unknown-linux-gnu
        export PATH="$HOME/.cargo/bin:$PATH"

    - name: Build server plugin
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --package server --release
        strip -s target/release/libserver.so -o stripped.so

    - uses: actions/upload-artifact@v4
      with:
        name: cef-alma-${{ matrix.version }}.so
        path: stripped.so

  build_server_debian_modern:
    runs-on: ubuntu-latest
    container: debian:${{ matrix.version }}
    strategy:
      matrix:
        version: [11, 12]

    steps:
    - name: Install i686 deps
      run: |
        apt-get update
        apt-get install build-essential curl make git gcc g++ libc6-dev -y

    - uses: actions/checkout@v4

    - name: Install nightly rust i686
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2022-11-06-i686-unknown-linux-gnu
        export PATH="$HOME/.cargo/bin:$PATH"

    - name: Build server plugin
      run: |
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --package server --release
        strip -s target/release/libserver.so -o stripped.so

    - uses: actions/upload-artifact@v4
      with:
        name: cef-debian-${{ matrix.version }}.so
        path: stripped.so

  build_server_debian_eol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [9, 10]

    steps:
    - uses: actions/checkout@v4

    - name: Build in Debian ${{ matrix.version }} container
      run: |
        docker run --rm -v $PWD:/workspace -w /workspace debian:${{ matrix.version }} bash -c '
          CODENAME=$(grep VERSION_CODENAME /etc/os-release | cut -d= -f2)
          echo "deb http://archive.debian.org/debian/ $CODENAME main" > /etc/apt/sources.list
          echo "deb http://archive.debian.org/debian-security $CODENAME/updates main" >> /etc/apt/sources.list
          echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
          apt-get update
          apt-get install build-essential curl make git gcc g++ libc6-dev -y
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly-2022-11-06-i686-unknown-linux-gnu
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --package server --release
          strip -s target/release/libserver.so -o stripped-debian${{ matrix.version }}.so
        '

    - uses: actions/upload-artifact@v4
      with:
        name: cef-debian-${{ matrix.version }}.so
        path: stripped-debian${{ matrix.version }}.so

  build_client:
    runs-on: windows-latest
    steps:
    - name: Configuration
      run: |
        Write-Output "DX_SDK_DIR=${env:TEMP}/dxsdk" >> ${env:GITHUB_ENV}
        Write-Output "DX_SDK=${env:TEMP}/dxsdk/Lib/x86" >> ${env:GITHUB_ENV}
        Write-Output "CEF_PATH=${env:TEMP}/cef" >> ${env:GITHUB_ENV}

    - name: DirectX SDK cache
      id: dx-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.DX_SDK_DIR }}
        key: directx

    - name: CEF static library cache
      id: cef-cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CEF_PATH }}
        key: libcef

    - name: Install DirectX SDK
      if: steps.dx-cache.outputs.cache-hit != 'true'
      run: |
        curl -L https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe -o _DX2010_.exe
        7z x _DX2010_.exe DXSDK/Lib/x86 -o_DX2010_
        mv _DX2010_/DXSDK $DX_SDK_DIR
        rm -fR _DX*_ _DX*_.exe
      shell: bash

    - name: Download CEF static library
      if: steps.cef-cache.outputs.cache-hit != 'true'
      run: |
        curl -L --ssl-no-revoke https://github.com/ZOTTCE/samp-cef/releases/download/v1.1-beta/libcef.lib -o libcef.lib
        mkdir $CEF_PATH
        mv libcef.lib $CEF_PATH/libcef.lib
      shell: bash

    - name: Install nightly rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly-2022-11-06-i686-pc-windows-msvc
        override: true

    - uses: actions/checkout@v4
    - name: Build client
      run: cargo build --release
      shell: bash

    - name: Make a package
      run: |
        mkdir redist && cd redist
        curl -L --ssl-no-revoke https://github.com/ZOTTCE/samp-cef/releases/download/v1.1-beta/cef.zip -o cef_redist.zip
        7z x cef_redist.zip -ocef
        cp ../target/release/client.dll cef/client.dll
        cp ../target/release/renderer.exe cef/renderer.exe
        cp ../target/release/loader.dll cef.asi
        7z a -tzip cef.zip cef.asi cef
      shell: bash

    - uses: actions/upload-artifact@v4
      with:
        name: client.dll
        path: target/release/client.dll

    - uses: actions/upload-artifact@v4
      with:
        name: renderer.exe
        path: target/release/renderer.exe

    - uses: actions/upload-artifact@v4
      with:
        name: cef.asi
        path: target/release/loader.dll

    - uses: actions/upload-artifact@v4
      with:
        name: cef-windows.dll
        path: target/release/server.dll

    - uses: actions/upload-artifact@v4
      with:
        name: cef.zip
        path: redist/cef.zip
